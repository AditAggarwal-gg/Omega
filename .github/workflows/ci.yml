name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
      NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
      NUXT_SUPABASE_SECRET_KEY: ${{ secrets.NUXT_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare Nuxt (generates .nuxt/tsconfig.json)
        run: npx nuxi prepare

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run test suite against Supabase (tenant isolation, RLS, RPCs)
        run: npm run test

      - name: Production build
        run: npm run build
